[project]
name = "gateway"
version = "0.1.0"
description = "漫剧平台 API 网关 / BFF：唯一对外入口"
requires-python = ">=3.11"
dependencies = [
    "cdrama-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
cdrama-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
