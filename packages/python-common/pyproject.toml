[project]
name = "cdrama-common"
version = "0.1.0"
description = "漫剧平台跨微服务共享库：配置加载、结构化日志、健康检查契约"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cdrama_common"]
